<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<body class="en-menu">
<div id="app">
  <header id="barra">
    <a class="volver" href="../" data-f>← Menú</a>
    <h1 class="titulo">HOCKEY</h1>
    <div class="acciones">
      <button type="button" class="icono" id="bPantalla" aria-label="Pantalla completa" title="Pantalla completa" data-f>⛶</button>
      <button type="button" class="icono" id="bSonido" aria-label="Sonido" title="Sonido" data-f>♪</button>
      <button type="button" class="icono" id="bPausa" aria-label="Pausa" title="Pausa (P)" data-f hidden>⏸</button>
      <button type="button" class="icono" id="bAjustes" aria-label="Ajustes" title="Ajustes" data-f>⚙</button>
      <button type="button" class="icono" id="bAyuda" aria-label="Ayuda" title="Ayuda" data-f>?</button>
    </div>
  </header>
  <section id="menu">
    <div class="logo" aria-hidden="true"><i></i><b></b></div>
    <h2 class="gran">HOCKEY DE MESA</h2>
    <p class="lema">Rápido, potente y con amigos.</p>
    <div id="cuentaLinea" class="cuenta-linea" hidden></div>
    <p class="monedas" id="monedas"></p>
    <div class="lista-menu" id="listaMenu"></div>
  </section>
  <main id="juego" hidden>
    <div id="lienzo"><canvas id="cv" aria-label="Mesa de hockey"></canvas></div>
    <div id="pista" hidden></div>
  </main>
  <div id="modales" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="fps" hidden></div>
</div>

<script src="js/fisica.js"></script>
