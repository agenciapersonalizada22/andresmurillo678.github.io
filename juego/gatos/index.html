<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0618">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Gatos Explosivos</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d1040'/%3E%3Ccircle cx='32' cy='38' r='17' fill='%2323232e'/%3E%3Cpolygon points='17,30 18,12 29,22' fill='%2323232e'/%3E%3Cpolygon points='47,30 46,12 35,22' fill='%2323232e'/%3E%3Ccircle cx='26' cy='36' r='4' fill='%23fff'/%3E%3Ccircle cx='38' cy='36' r='4' fill='%23fff'/%3E%3Cpath d='M32 21 q3 -7 9 -9' stroke='%23ffb000' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../comun/lobby.css">
  <link rel="stylesheet" href="../comun/cuenta.css">
</head>
<body class="en-menu">
<div id="app">
  <header id="barra">
    <a class="volver" href="../">← Menú</a>
    <h1 class="titulo">GATOS</h1>
    <div class="acciones">
      <button type="button" class="icono" id="bPantalla" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      <button type="button" class="icono" id="bSonido" aria-label="Sonido" title="Sonido">♪</button>
      <button type="button" class="icono" id="bLog" aria-label="Historial de jugadas" title="Historial" hidden>☰</button>
      <button type="button" class="icono" id="bChat" aria-label="Chat y reacciones" title="Chat (T)" hidden>💬</button>
      <button type="button" class="icono" id="bMenu" aria-label="Pausa y menú" title="Pausa (Esc)" hidden>⏸</button>
      <button type="button" class="icono" id="bAjustes" aria-label="Ajustes" title="Ajustes">⚙</button>
      <button type="button" class="icono" id="bAyuda" aria-label="Ayuda" title="Ayuda (?)">?</button>
    </div>
  </header>

  <section id="menu" class="capa pantalla">
    <div id="logo" aria-hidden="true"></div>
    <h2 class="gran">GATOS<span>EXPLOSIVOS</span></h2>
    <p class="lema">Roba con cuidado: en el mazo hay gatos que explotan.</p>
    <div id="cuentaLinea" class="cuenta-linea" hidden></div>
    <div class="lista-menu" id="listaMenu"></div>
  </section>

  <main id="mesa" hidden>
    <div id="rivales" aria-label="Rivales"></div>
    <div id="centro">
      <div id="pilas">
        <div class="pila-wrap"><button type="button" id="mazo" aria-label="Mazo de robo"></button><button type="button" id="bFuturo" class="mini-btn" hidden></button></div>
        <div id="descarte" role="img"></div>
      </div>
      <div id="jugada" class="jugada" hidden aria-live="polite"></div>
    </div>
    <div id="estado" role="status"></div>
    <div id="tiempo" class="tiempo" hidden><i></i></div>
    <div id="selInfo" hidden></div>
    <div id="zonaYo">
      <div id="miInfo"></div>
      <div id="mano" role="group" aria-label="Tu mano"></div>
    </div>
    <div id="acciones">
      <button type="button" id="bRobar" class="btn acc">Robar y terminar</button>
      <button type="button" id="bJugar" class="btn acc" hidden>Jugar</button>
      <button type="button" id="bNope" class="btn acc" disabled><span>¡Miau No!</span></button>
    </div>
    <div id="chatPanel" class="panel-chat" hidden></div>
    <div id="logPanel" hidden></div>
    <div id="burbujas"></div>
    <div id="finPanel" class="capa panel-fin" hidden></div>
  </main>

  <div id="modal" class="capa" hidden></div>
  <div id="toasts" aria-hidden="true"></div>
  <div id="aria" class="sr" aria-live="polite"></div>
  <div id="fps" hidden></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="boom" aria-hidden="true"></div>
</div>
<script src="../comun/firebase-config.js"></script>
<script src="../comun/mando.js"></script>
<script src="../comun/red.js"></script>
<script src="../comun/lobby.js"></script>
<script src="../plataforma/juegos.js"></script>
<script src="../comun/cuenta.js"></script>
<script src="../comun/amigos.js"></script>
<script type="module" src="js/arranque.js"></script>
<noscript><p style="color:#fff;padding:1rem">Este juego necesita JavaScript.</p></noscript>
</body>
</html>
