<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1424">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Gimnasio Mental: 24 minijuegos de práctica cognitiva con dificultad adaptativa. Entretenimiento, no un tratamiento.">
  <title>Gimnasio Mental</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e1424'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%237cc4ff' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23ffd34d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../comun/cuenta.css">
</head>
<body>
<div id="app">
  <header id="barra">
    <a class="volver" data-f href="../">Portal</a>
    <button type="button" class="icono" id="bVolver" data-f aria-label="Atrás" hidden>←</button>
    <h1 id="titulo">Gimnasio Mental</h1>
    <span id="emblema" class="emblema" hidden aria-hidden="true"></span>
    <span class="monedas-chip" title="Monedas virtuales" aria-label="Monedas virtuales"><i aria-hidden="true">◉</i> <b id="monedas">0</b></span>
    <div class="acciones">
      <button type="button" class="icono" id="bInicio" data-f aria-label="Inicio" title="Inicio">⌂</button>
      <button type="button" class="icono" id="bPantalla" data-f aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      <button type="button" class="icono" id="bAyuda" data-f aria-label="Ayuda" title="Ayuda">?</button>
      <button type="button" class="icono" id="bAjustes" data-f aria-label="Ajustes" title="Ajustes">⚙</button>
    </div>
  </header>
  <div id="chipCuenta" class="chip-linea" hidden></div>
  <main id="pantalla" aria-live="polite"></main>
  <section id="juego" hidden aria-label="Juego"></section>
  <footer class="aviso-fijo" role="note">Entretenimiento y práctica: no afirma mejorar la inteligencia ni sustituye una evaluación médica o neuropsicológica.</footer>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="fps" hidden></div>
<script src="../comun/firebase-config.js"></script>
<script src="../comun/mando.js"></script>
<script src="../plataforma/juegos.js"></script>
<script src="../comun/cuenta.js"></script>
<script src="../comun/amigos.js"></script>
<script type="module" src="js/arranque.js"></script>
<noscript><p style="padding:1rem">Esta aplicación necesita JavaScript.</p></noscript>
</body>
</html>
