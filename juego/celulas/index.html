<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05030f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Células</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305030f'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%233df5ff'/%3E%3Ccircle cx='25' cy='26' r='5' fill='%23fff' opacity='.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../comun/lobby.css">
  <link rel="stylesheet" href="../comun/cuenta.css">
</head>
<body class="en-menu">
  <canvas id="cv" aria-label="Mundo de células"></canvas>

  <div id="hud" class="oculto">
    <div id="hudArriba">
      <button type="button" class="ic" id="btnPausaHud" aria-label="Pausa">⏸</button>
      <button type="button" class="ic" id="btnPantalla" aria-label="Pantalla completa">⛶</button>
      <div id="hudModo"></div>
    </div>
    <aside id="clasif" aria-label="Clasificación"><h3>Clasificación</h3><ol id="lbLista"></ol><div id="eqBarra" class="oculto"></div></aside>
    <canvas id="mini" width="140" height="140" aria-label="Minimapa"></canvas>
    <div id="hudInfo"><div><small>MASA</small><b id="hMasa">0</b></div><div><small>PUESTO</small><b id="hPuesto">-</b></div><div><small>TIEMPO</small><b id="hTiempo">0:00</b></div><div><small>BAJAS</small><b id="hBajas">0</b></div></div>
    <div id="fps" class="oculto"></div>
    <div id="avisos" aria-live="polite"></div>
    <div id="pausaMov" class="oculto">MOVIMIENTO EN PAUSA (Q)</div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <div id="tactil">
      <button type="button" id="btnExpulsar">EXPULSAR</button>
      <button type="button" id="btnDividir">DIVIDIR</button>
    </div>
  </div>

  <main id="menu" class="pantalla"></main>
  <section id="pausa" class="pantalla oculto" role="dialog" aria-label="Pausa"></section>
  <section id="muerte" class="pantalla oculto" role="dialog" aria-label="Fin de la vida"></section>
  <section id="ajustes" class="pantalla oculto" role="dialog" aria-label="Ajustes"></section>
  <section id="logros" class="pantalla oculto" role="dialog" aria-label="Logros"></section>
  <section id="ranking" class="pantalla oculto" role="dialog" aria-label="Ranking"></section>
  <section id="ayuda" class="pantalla oculto" role="dialog" aria-label="Ayuda"></section>
  <section id="sala" class="pantalla oculto" role="alertdialog" aria-label="Aviso de sala"></section>

  <script src="../comun/firebase-config.js"></script>
  <script src="../comun/mando.js"></script>
  <script src="../comun/red.js"></script>
  <script src="../comun/lobby.js"></script>
  <script src="../plataforma/juegos.js"></script>
  <script src="../comun/cuenta.js"></script>
  <script src="../comun/amigos.js"></script>
  <script src="js/util.js"></script>
  <script src="js/config.js"></script>
  <script src="js/hash.js"></script>
  <script src="js/mundo.js"></script>
  <script src="js/ia.js"></script>
  <script src="js/protocolo.js"></script>
  <script src="js/replica.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/logros.js"></script>
  <script src="js/skins.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/entrada.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/multi.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cuentajuego.js"></script>
  <script src="js/principal.js"></script>
</body>
</html>
