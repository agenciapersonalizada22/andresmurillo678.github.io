<body class="en-menu">
<div id="app">
  <header id="barra">
    <a class="volver" href="../">← Menú</a>
    <h1 class="titulo">MESA DE MINIJUEGOS</h1>
    <div class="acciones">
      <button type="button" class="icono" id="bPantalla" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      <button type="button" class="icono" id="bSonido" aria-label="Sonido" title="Sonido">♪</button>
      <button type="button" class="icono" id="bAjustes" aria-label="Ajustes" title="Ajustes">⚙</button>
      <button type="button" class="icono" id="bAyuda" aria-label="Ayuda" title="Ayuda">?</button>
    </div>
  </header>
  <section id="menu" class="pantalla">
    <div class="logo" aria-hidden="true"><i class="f0"></i><i class="f1"></i><i class="f2"></i><i class="f3"></i></div>
    <h2 class="gran">MESA</h2>
    <p class="lema">24 minijuegos para 1 a 4 jugadores en la misma pantalla.</p>
    <div id="cuentaLinea" class="cuenta-linea" hidden></div>
    <div class="lista-menu" id="listaMenu"></div>
  </section>
  <main id="escena" hidden>
    <canvas id="lienzo"></canvas>
    <button type="button" id="bPausa" aria-label="Pausa" title="Pausa (Esc)">⏸</button>
    <div id="capaRonda" class="capa-ronda" hidden></div>
  </main>
