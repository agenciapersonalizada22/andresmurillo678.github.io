<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06202f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Colonos de Isla</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2306202f'/%3E%3Cpolygon points='32,8 52,20 52,44 32,56 12,44 12,20' fill='%232b7a45' stroke='%23f5e8bc' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23f5e8bc'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../comun/lobby.css">
  <link rel="stylesheet" href="../comun/cuenta.css">
</head>
<body class="en-menu">
<div id="app">
  <header id="barra">
    <a class="volver" href="../">← Menú</a>
    <h1 class="titulo">COLONOS DE ISLA</h1>
    <div class="acciones">
      <button type="button" class="icono" id="bPantalla" aria-label="Pantalla completa" title="Pantalla completa">⛶</button>
      <button type="button" class="icono" id="bSonido" aria-label="Sonido" title="Sonido">♪</button>
      <button type="button" class="icono" id="bChat" aria-label="Chat y reacciones" title="Chat (T)" hidden>💬</button>
      <button type="button" class="icono" id="bMenu" aria-label="Pausa y menú" title="Pausa (P)" hidden>⏸</button>
      <button type="button" class="icono" id="bAjustes" aria-label="Ajustes" title="Ajustes">⚙</button>
      <button type="button" class="icono" id="bAyuda" aria-label="Ayuda" title="Ayuda (?)">?</button>
    </div>
  </header>

  <section id="menu" class="capa pantalla">
    <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <h2 class="gran">COLONOS<br>DE ISLA</h2>
    <p class="lema">Funda poblados, comercia y domina la isla. Con bots y amigos.</p>
    <div id="cuentaLinea" class="cuenta-linea" hidden></div>
    <div class="lista-menu" id="listaMenu"></div>
  </section>

  <main id="mesa" hidden>
    <div id="jugadores" aria-label="Jugadores"></div>
    <div id="escenario">
      <canvas id="lienzo" aria-label="Tablero de la isla" role="img"></canvas>
      <div id="tiempo" class="tiempo" hidden><i></i></div>
      <div id="estado" role="status"></div>
      <div id="dados" hidden aria-live="polite"></div>
      <div id="herramientas"></div>
      <div id="tip" hidden></div>
      <div id="pista" hidden></div>
      <div id="confirmaBar" hidden></div>
    </div>
    <div id="zonaYo">
      <div id="mano" role="group" aria-label="Tus recursos"></div>
      <div id="acciones"></div>
    </div>
    <div id="chatPanel" class="panel-chat" hidden></div>
    <div id="burbujas"></div>
    <div id="finPanel" class="capa panel-fin" hidden></div>
  </main>

  <div id="toasts" aria-hidden="true"></div>
  <div id="aria" class="sr" aria-live="polite"></div>
  <div id="fps" hidden></div>
</div>
<script src="../comun/firebase-config.js"></script>
<script src="../comun/mando.js"></script>
<script src="../comun/red.js"></script>
<script src="../comun/lobby.js"></script>
<script src="../plataforma/juegos.js"></script>
<script src="../comun/cuenta.js"></script>
<script src="../comun/amigos.js"></script>
<script type="module" src="js/arranque.js"></script>
<noscript><p style="color:#fff;padding:1rem">Este juego necesita JavaScript.</p></noscript>
</body>
</html>
