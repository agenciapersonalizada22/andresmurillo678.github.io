<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Turismo Mundial</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b2a3f'/%3E%3Ctext x='32' y='46' font-size='38' font-weight='bold' text-anchor='middle' fill='%2342d4f4'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../comun/lobby.css">
  <link rel="stylesheet" href="../comun/cuenta.css">
</head>
<body class="enMenu">
  <div id="app">
    <div id="escena"></div>
    <header id="sup">
      <a class="volver" href="../" data-f aria-label="Volver al menú de juegos">←</a>
      <h1>TURISMO MUNDIAL</h1>
      <span id="tiempo" aria-live="off"></span>
      <div class="acc">
        <button type="button" class="icono" id="btnVista" data-f aria-label="Vista cenital" title="Vista cenital (V)">⌖</button>
        <button type="button" class="icono" id="btnSonido" data-f aria-label="Sonido" title="Sonido (M)">♪</button>
        <button type="button" class="icono" id="btnPantalla" data-f aria-label="Pantalla completa" title="Pantalla completa (F)">⛶</button>
        <button type="button" class="icono" id="btnAjustes" data-f aria-label="Ajustes" title="Ajustes">⚙</button>
        <button type="button" class="icono" id="btnPausa" data-f aria-label="Pausa o menú" title="Pausa (Esc)">☰</button>
      </div>
    </header>
    <section id="jugs" aria-label="Jugadores"></section>
    <div id="mini" hidden></div>
    <div id="carta" aria-live="polite"></div>
    <div id="fps" hidden></div>
    <footer id="barra">
      <div id="ctx" aria-live="polite"></div>
      <div id="prim"></div>
      <div id="sec"></div>
    </footer>
  </div>
  <div id="menu"></div>
  <script src="../comun/firebase-config.js"></script>
  <script src="../comun/mando.js"></script>
  <script src="../comun/red.js"></script>
  <script src="../comun/lobby.js"></script>
  <script src="../plataforma/juegos.js"></script>
  <script src="../comun/cuenta.js"></script>
  <script src="../comun/amigos.js"></script>
  <script type="module" src="js/arranque.js"></script>
</body>
</html>
