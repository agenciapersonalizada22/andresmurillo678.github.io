<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6fa">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Pizarra colaborativa en tiempo real para tableta, lápiz, ratón y mando. Sin cuenta ni servidor.">
  <title>Pizarra</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M16 46l6-16 18-18 8 8-18 18z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../../juego/comun/lobby.css">
</head>
<body>
  <a class="saltar" href="#escena">Saltar al lienzo</a>
  <div id="app">
    <header id="barraSup" role="toolbar" aria-label="Barra superior"></header>
    <div id="cuerpo">
      <nav id="herramientas" role="toolbar" aria-label="Herramientas" aria-orientation="vertical"></nav>
      <main id="escena" aria-label="Lienzo de la pizarra">
        <canvas id="lienzo" aria-hidden="true"></canvas>
        <canvas id="superior" aria-hidden="true"></canvas>
      </main>
      <aside id="props" aria-label="Propiedades"></aside>
      <aside id="paginas" aria-label="Páginas"></aside>
    </div>
  </div>
  <div id="avisos" role="status" aria-live="polite"></div>
  <input type="file" id="archivoImg" accept="image/*" multiple hidden>
  <input type="file" id="archivoJson" accept=".json,application/json" hidden>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
  <script src="../../juego/comun/mando.js"></script>
  <script src="../../juego/comun/red.js"></script>
  <script src="../../juego/comun/lobby.js"></script>
  <script type="module" src="js/principal.js"></script>
</body>
</html>
